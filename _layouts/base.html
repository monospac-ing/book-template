<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title and page.title != site.title %}
  <title>{{ page.title }} / {{ site.title }}</title>
  {% else %}
  <title>{{ site.title }}</title>
  {% endif %}
  {% assign description = page.description | default: site.description %}
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="book">
  <meta name="twitter:card" content="summary">
  <script>try { var face = localStorage.getItem("face"); if (face) document.documentElement.dataset.face = face; } catch (e) {}</script>
  <link rel="stylesheet" href="{{ '/assets/css/book.css' | relative_url }}">
  <style>:root { --accent: {{ site.accent | default: '#d7261e' }}; }</style>
</head>
<body class="{{ page.body_class | default: 'page' }}">
{{ content }}
<script src="{{ '/assets/js/book.js' | relative_url }}" defer></script>
</body>
</html>
